[package]
name = "doc-to-pdf"
version = "0.1.0"
edition = "2024"

[dependencies]
libreoffice-rs = "0.3.3"
anyhow = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
rust-embed = { version = "8.11", features = ["compression"] }
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "doc-to-pdf"
path = "src/main.rs"